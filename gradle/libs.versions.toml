[versions]
java = "25"
spring-boot = "3.5.4"
spring-cloud = "2025.0.0"
kafka = "4.0.0"
flink = "2.1.0"
postgres = "42.7.8"
clickhouse = "0.9.2"
junit = "5.13.4"
testcontainers = "1.21.3"
micrometer = "1.16.0"

[libraries]
spring-boot-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-cloud-stream = { module = "org.springframework.cloud:spring-cloud-stream" }
kafka = { module = "org.springframework.kafka:spring-kafka" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
clickhouse = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouse" }
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
testcontainers = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }