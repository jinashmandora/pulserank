[versions]

spring-boot = "4.1.0"
avro = "1.12.1"
avro-gradle-plugin = "0.1.1"
apicurio = "3.2.5"
flink-connector-clickhouse = "0.2.0"
flyway = "12.11.0"
flyway-database-clickhouse = "10.24.0"
clickhouse-jdbc = "0.9.8"

[libraries]

# Spring
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
flink-connector-clickhouse = { module = "com.clickhouse.flink:flink-connector-clickhouse-2.0.0", version.ref = "flink-connector-clickhouse" }
clickhouse-jdbc = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouse-jdbc" }

spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-starter-data-redis-test = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }

# Avro
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
apicurio-registry-avro = { module = "io.apicurio:apicurio-registry-avro-serde-kafka", version.ref = "apicurio" }
flyway-database-clickhouse = { module = "org.flywaydb:flyway-database-clickhouse", version.ref = "flyway-database-clickhouse" }

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
avro = { id = "eu.eventloopsoftware.avro-gradle-plugin", version.ref = "avro-gradle-plugin" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }