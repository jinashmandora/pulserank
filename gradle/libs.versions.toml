[versions]

spring-boot = "4.1.0"
avro = "1.12.1"
avro-gradle-plugin = "0.1.1"
apicurio = "3.2.5"

[libraries]

# Spring
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }

# Avro
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
apicurio-registry-avro = { module = "io.apicurio:apicurio-registry-avro-serde-kafka", version.ref = "apicurio" }

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
avro = { id = "eu.eventloopsoftware.avro-gradle-plugin", version.ref = "avro-gradle-plugin" }